        console.log("No 1 Menghitung Luas Segitiga:");

        let tinggi = 5;

        let luas = 0.5 * alas * tinggi;

         // Soal 3: Bilangan genap 1 sampai 10

        for (let i = 1; i <= 10; i++) {

                console.log(i);
            }
        }

    </script>
