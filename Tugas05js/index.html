<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tugas 5 JavaScript</title>
</head>
<body>

    <h1>Tugas 5 JavaScript</h1>
    <p>Buka Console untuk melihat hasilnya.</p>

    <script>
        // 1A. Angka 1 sampai 10
        console.log("A. Angka 1 sampai 10");

        for (let i = 1; i <= 10; i++) {
            console.log(i);
        }

        // 1B. Hitungan mundur
        console.log("B. Hitungan mundur");

        for (let i = 5; i >= 1; i--) {
            console.log(i);
        }

        console.log("mulai!");

        // 2. Akumulasi angka menggunakan while
        console.log("C. Total akumulasi angka");

        let angka = 1;
        let total = 0;

        while (angka <= 5) {
            total = total + angka;
            angka++;
        }

        console.log("Total penjumlahan:", total);
    </script>

</body>
</html>
