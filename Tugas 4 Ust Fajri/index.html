
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080a12">

    <title>Media & Layout</title>
    <link rel="icon" href="../logo1.ico">

    <style>
        /* =========================
           1. GLOBAL & THEME
        ========================= */
        :root {
            --bg: #080a12;
            --card: rgba(18, 22, 38, 0.78);
            --cyan: #69f0ff;
            --purple: #a78bfa;
            --pink: #f0abfc;
            --green: #7dffcc;
            --text: #f5f7ff;
            --border: rgba(255, 255, 255, 0.11);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            padding: 65px 7% 80px;
            color: var(--text);
            background: var(--bg);
            font-family: "Segoe UI", Arial, sans-serif;
            isolation: isolate;
        }

        /* Latar gradasi atmosferik */
        body::before,
        body::after {
            content: "";
            position: fixed;
            z-index: -2;
            width: 480px;
            height: 480px;
            border-radius: 50%;
            filter: blur(110px);
            opacity: 0.17;
            pointer-events: none;
            animation: ambient 14s ease-in-out infinite alternate;
        }

        body::before {
            top: -180px;
            left: -160px;
            background: #6547ff;
        }

        body::after {
            right: -180px;
            bottom: -180px;
            background: #00d9ff;
            animation-delay: -7s;
        }

        /* Tekstur grid */
        .background-grid {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            opacity: 0.13;
            background-image:
                linear-gradient(
                    rgba(255, 255, 255, 0.035) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.035) 1px,
                    transparent 1px
                );
            background-size: 48px 48px;
            mask-image: linear-gradient(to bottom, black, transparent 90%);
        }

        /* =========================
           2. EFEK KURSOR
        ========================= */
        .cursor-glow {
            position: fixed;
            z-index: -1;
            top: 0;
            left: 0;
            width: 360px;
            height: 360px;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            background: radial-gradient(
                circle,
                rgba(105, 240, 255, 0.085),
                rgba(167, 139, 250, 0.035) 35%,
                transparent 70%
            );
            transform: translate(-50%, -50%);
            transition: opacity 0.3s ease;
        }

        /* =========================
           3. JUDUL UTAMA
        ========================= */
        .heading {
            position: relative;
            width: fit-content;
            max-width: 100%;
            margin: 0 auto 58px;
            text-align: center;
            animation: title-enter 1s cubic-bezier(.2, .7, .2, 1) both;
        }

        .heading h1 {
            font-size: clamp(40px, 7vw, 78px);
            font-weight: 850;
            letter-spacing: -3.5px;
            line-height: 1.1;
            color: transparent;
            background: linear-gradient(
                110deg,
                #ffffff 10%,
                #b5f8ff 38%,
                #a99aff 68%,
                #ffffff 90%
            );
            background-size: 220% auto;
            background-clip: text;
            -webkit-background-clip: text;
            animation: title-shine 7s linear infinite;
        }

        .heading h1 span {
            color: var(--cyan);
            text-shadow: 0 0 35px rgba(105, 240, 255, 0.18);
        }

        .heading::after {
            content: "";
            display: block;
            width: 85px;
            height: 3px;
            margin: 20px auto 0;
            border-radius: 10px;
            background: linear-gradient(
                90deg,
                transparent,
                var(--cyan),
                var(--purple),
                transparent
            );
            box-shadow: 0 0 20px rgba(105, 240, 255, 0.55);
            animation: underline-pulse 4s ease-in-out infinite;
        }

        /* =========================
           4. GRID MEDIA
        ========================= */
        .gallery {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 26px;
            width: 100%;
            max-width: 1200px;
            margin: auto;
            perspective: 1200px;
        }

        /* =========================
           5. KARTU MEDIA
        ========================= */
        .media-card {
            --mouse-x: 50%;
            --mouse-y: 50%;
            --tilt-x: 0deg;
            --tilt-y: 0deg;
            --accent: var(--cyan);

            position: relative;
            min-width: 0;
            padding: 18px;
            overflow: hidden;
            isolation: isolate;
            border: 1px solid var(--border);
            border-radius: 23px;
            background: var(--card);
            transform-style: preserve-3d;
            transform: perspective(1000px)
                rotateX(var(--tilt-x))
                rotateY(var(--tilt-y));
            transition:
                transform 0.22s ease,
                border-color 0.35s ease,
                box-shadow 0.35s ease,
                background 0.35s ease;
            opacity: 0;
            animation: card-enter 0.85s cubic-bezier(.2, .7, .2, 1)
                forwards;
            animation-delay: var(--delay, 0s);
        }

        .media-card:nth-child(2) {
            --accent: var(--purple);
        }

        .media-card:nth-child(3) {
            --accent: #ff9cda;
        }

        .media-card:nth-child(4) {
            --accent: var(--green);
        }

        /* Border bercahaya */
        .media-card::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            padding: 1px;
            border-radius: inherit;
            background: radial-gradient(
                280px circle at var(--mouse-x) var(--mouse-y),
                var(--accent),
                transparent 75%
            );
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;

            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }

        /* Cahaya mengikuti kursor */
        .media-card::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            border-radius: inherit;
            background: radial-gradient(
                260px circle at var(--mouse-x) var(--mouse-y),
                color-mix(in srgb, var(--accent) 12%, transparent),
                transparent 75%
            );
            opacity: 0;
            transition: opacity 0.35s ease;
            pointer-events: none;
        }

        .media-card:hover {
            border-color: color-mix(
                in srgb,
                var(--accent) 48%,
                transparent
            );
            box-shadow:
                0 22px 65px rgba(0, 0, 0, 0.3),
                0 0 35px color-mix(
                    in srgb,
                    var(--accent) 9%,
                    transparent
                );
            background: rgba(22, 26, 45, 0.92);
        }

        .media-card:hover::before,
        .media-card:hover::after {
            opacity: 1;
        }

        /* =========================
           6. LABEL MEDIA
        ========================= */
        .media-label {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 3px 5px 17px;
            color: #f5f7ff;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 3px;
            transition: color 0.3s ease;
        }

        .media-label::before {
            content: "";
            width: 22px;
            height: 2px;
            flex-shrink: 0;
            border-radius: 10px;
            background: var(--accent);
            box-shadow: 0 0 12px var(--accent);
            transition: width 0.3s ease;
        }

        .media-card:hover .media-label {
            color: var(--accent);
        }

        .media-card:hover .media-label::before {
            width: 38px;
        }

        /* =========================
           7. KONTEN MEDIA
        ========================= */
        .media-content {
            position: relative;
            z-index: 1;
            overflow: hidden;
            border-radius: 14px;
            background: #090c16;
            transform: translateZ(12px);
        }

        /* IMAGE */
        .media-content img {
            display: block;
            width: 100%;
            height: 310px;
            object-fit: cover;
            border-radius: 14px;
            transition:
                transform 0.7s cubic-bezier(.2, .7, .2, 1),
                filter 0.5s ease;
        }

        .media-card:hover .media-content img {
            transform: scale(1.045);
            filter: saturate(1.12) contrast(1.03);
        }

        /* AUDIO */
        .audio-content {
            display: grid;
            place-items: center;
            min-height: 310px;
            padding: 35px 22px;
            background:
                radial-gradient(
                    circle at 50% 40%,
                    rgba(167, 139, 250, 0.16),
                    transparent 48%
                ),
                linear-gradient(145deg, #15182b, #0b0d18);
        }

        .audio-art {
            position: relative;
            display: grid;
            place-items: center;
            width: 130px;
            height: 130px;
            margin-bottom: 35px;
            border: 1px solid rgba(167, 139, 250, 0.5);
            border-radius: 50%;
            background: radial-gradient(
                circle,
                rgba(167, 139, 250, 0.22),
                rgba(105, 240, 255, 0.025) 70%
            );
            box-shadow:
                0 0 35px rgba(167, 139, 250, 0.12),
                inset 0 0 25px rgba(167, 139, 250, 0.08);
        }

        .audio-art::before,
        .audio-art::after {
            content: "";
            position: absolute;
            inset: -12px;
            border: 1px solid rgba(167, 139, 250, 0.2);
            border-radius: 50%;
            animation: orbit-pulse 3s ease-in-out infinite;
        }

        .audio-art::after {
            inset: -25px;
            border-color: rgba(105, 240, 255, 0.13);
            animation-delay: -1.5s;
        }

        .audio-symbol {
            color: #d7caff;
            font-size: 48px;
            filter: drop-shadow(
                0 0 14px rgba(167, 139, 250, 0.55)
            );
            transition: transform 0.35s ease;
        }

        .media-card:hover .audio-symbol {
            transform: scale(1.15);
        }

        .audio-content audio {
            width: 100%;
            max-width: 380px;
            height: 44px;
        }

        /* VIDEO LOKAL */
        .video-content video {
            display: block;
            width: 100%;
            max-height: 360px;
            aspect-ratio: 16 / 9;
            object-fit: contain;
            border-radius: 14px;
            background: #000;
        }

        /* YOUTUBE */
        .youtube-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: #000;
        }

        .youtube-frame iframe {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* =========================
           8. ANIMASI
        ========================= */
        @keyframes ambient {
            from {
                transform: translate3d(0, 0, 0) scale(1);
            }
            to {
                transform: translate3d(70px, 45px, 0) scale(1.15);
            }
        }

        @keyframes title-enter {
            from {
                opacity: 0;
                transform: translateY(25px);
                filter: blur(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @keyframes title-shine {
            to {
                background-position: 220% center;
            }
        }

        @keyframes underline-pulse {
            0%, 100% {
                opacity: 0.7;
                transform: scaleX(0.8);
            }
            50% {
                opacity: 1;
                transform: scaleX(1.2);
            }
        }

        @keyframes card-enter {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.97);
                filter: blur(5px);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        @keyframes orbit-pulse {
            0%, 100% {
                transform: scale(0.97);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.06);
                opacity: 1;
            }
        }

        /* =========================
           9. RESPONSIVE
        ========================= */
        @media (max-width: 760px) {
            body {
                padding: 45px 5% 55px;
            }

            .heading {
                margin-bottom: 38px;
            }

            .heading h1 {
                letter-spacing: -2px;
            }

            .gallery {
                grid-template-columns: 1fr;
                gap: 20px;
                max-width: 560px;
            }

            .media-content img {
                height: auto;
                max-height: 380px;
                object-fit: contain;
            }

            .audio-content {
                min-height: 270px;
            }

            .cursor-glow {
                display: none;
            }

            .media-card {
                transform: none !important;
            }
        }

        /* Kurangi animasi sesuai preferensi perangkat */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <div class="background-grid" aria-hidden="true"></div>
    <div class="cursor-glow" aria-hidden="true"></div>

    <!-- JUDUL -->
    <header class="heading">
        <h1>Media <span>&</span> Layout</h1>
    </header>

    <!-- GALERI MEDIA -->
    <main class="gallery">

        <!-- IMAGE -->
        <section class="media-card" style="--delay: 0.1s">
            <h2 class="media-label">IMAGE</h2>

            <div class="media-content">
                <img
                    src="Asests/img.jpg"
                    alt="Gambar galeri"
                    loading="lazy"
                >
            </div>
        </section>

        <!-- AUDIO -->
        <section class="media-card" style="--delay: 0.2s">
            <h2 class="media-label">AUDIO</h2>

            <div class="media-content audio-content">
                <div class="audio-art" aria-hidden="true">
                    <span class="audio-symbol">♫</span>
                </div>

                <audio controls preload="metadata">
                    <source
                        src="Asests/audio.mp3"
                        type="audio/mpeg"
                    >
                    Browser tidak mendukung audio.
                </audio>
            </div>
        </section>

        <!-- VIDEO -->
        <section class="media-card" style="--delay: 0.3s">
            <h2 class="media-label">VIDEO</h2>

            <div class="media-content video-content">
                <video controls preload="metadata">
                    <source
                        src="Asests/video.mp4"
                        type="video/mp4"
                    >
                    Browser tidak mendukung video.
                </video>
            </div>
        </section>

        <!-- YOUTUBE -->
        <section class="media-card" style="--delay: 0.4s">
            <h2 class="media-label">YOUTUBE</h2>

            <div class="media-content youtube-frame">
                <iframe
                    src="https://www.youtube.com/embed/6ZK3GOukaVY?si=n52Pa3slkr2yFFf6"
                    title="Video YouTube"
                    loading="lazy"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen>
                </iframe>
            </div>
        </section>

    </main>

    <script>
        // =========================
        // EFEK KURSOR & 3D TILT
        // =========================
        const cards = document.querySelectorAll(".media-card");
        const glow = document.querySelector(".cursor-glow");

        const finePointer = window.matchMedia(
            "(hover: hover) and (pointer: fine)"
        );

        if (finePointer.matches) {
            document.addEventListener("pointermove", (event) => {
                glow.style.opacity = "1";
                glow.style.left = event.clientX + "px";
                glow.style.top = event.clientY + "px";
            });

            document.addEventListener("pointerleave", () => {
                glow.style.opacity = "0";
            });

            cards.forEach((card) => {
                card.addEventListener("pointermove", (event) => {
                    const rect = card.getBoundingClientRect();

                    const x = event.clientX - rect.left;
                    const y = event.clientY - rect.top;

                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;

                    const rotateY =
                        ((x - centerX) / centerX) * 4;

                    const rotateX =
                        ((centerY - y) / centerY) * 4;

                    card.style.setProperty("--mouse-x", x + "px");
                    card.style.setProperty("--mouse-y", y + "px");
                    card.style.setProperty(
                        "--tilt-x",
                        rotateX + "deg"
                    );
                    card.style.setProperty(
                        "--tilt-y",
                        rotateY + "deg"
                    );
                });

                card.addEventListener("pointerleave", () => {
                    card.style.setProperty("--tilt-x", "0deg");
                    card.style.setProperty("--tilt-y", "0deg");
                    card.style.setProperty("--mouse-x", "50%");
                    card.style.setProperty("--mouse-y", "50%");
                });
            });
        }
    </script>

</body>
</html>
