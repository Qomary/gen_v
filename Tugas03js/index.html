
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 03 JavaScript</title>
</head>
<body>

    <h1>Tugas 03 JavaScript</h1>
    <h2>1. Membuat Biodata Sederhana</h2>
    <h2>2. Mengubah Nilai Variabel</h2>

    <script>
        // Nomor 1: Membuat Biodata Sederhana

        let nama = "Jalal";
        let umur = 18;
        let isSiswa = true;

        console.log("=== BIODATA ===");
        console.log("Nama:", nama);
        console.log("Umur:", umur);
        console.log("Apakah Siswa:", isSiswa);


        // Nomor 2: Mengubah Nilai Variabel

        let nilai = 70;

        console.log("=== NILAI UJIAN ===");
        console.log("Nilai Awal:", nilai);

        nilai = 85;

        console.log("Nilai Setelah Diubah:", nilai);

    </script>

</body>
</html>
